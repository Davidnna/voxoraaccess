name: Format source code

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/format.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-format-main
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python formatters
        run: python -m pip install --upgrade black djlint

      - name: Format Python files
        run: black --line-length 88 .

      - name: Format Jinja templates
        run: djlint templates --reformat --indent 4 --profile=jinja

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Format styles, scripts and documentation
        run: |
          npx --yes prettier@3 --write "**/*.{css,js,json,yml,yaml,md}" --ignore-path .gitignore

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Format source code with four-space indentation"
          branch: main
