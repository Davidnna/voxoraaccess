name: Project quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py tests

      - name: Run source regression checks
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build production frontend
        run: npm run build

      - name: Install browser accessibility test dependencies
        run: npm install --no-audit --no-fund
        working-directory: tests/browser

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
        working-directory: tests/browser

      - name: Run browser accessibility and responsive tests
        run: npm test
        working-directory: tests/browser
